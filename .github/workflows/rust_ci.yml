name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # The firmware is excluded from the workspace because it builds for
  # xtensa-esp32s3-none-elf on the "esp" channel, so it gets its own job with
  # its own toolchain and its own lockfile.
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --all-features -- -D warnings
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware -> target
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  # The ICD and the host daemon build for the host on stable.
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --workspace --release
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --workspace --all-features -- -D warnings
    steps:
      - uses: actions/checkout@v6
      # bluest pulls in bluer -> libdbus-sys, which links against system D-Bus.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
