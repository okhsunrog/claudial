[package]
edition      = "2024"
name         = "claudial-firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "claudial-firmware"
path = "./src/bin/main.rs"
test = false

[lib]
test = false

# Verbatim copy of the workspace lint tables from ../Cargo.toml. This crate is
# excluded from the workspace (different toolchain), so it cannot inherit them
# — keep the two in sync when editing.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
unused_async = "warn"

[dependencies]
esp-hal = { version = "~1.2.2", features = [
  "defmt",
  "esp32s3",
  "unstable",
] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

defmt                  = "1.1.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32s3"] }

bt-hci = "0.9"

# Ergot messaging: this device is an edge node with a single BLE interface.
# Pinned to the same rev as the workspace root — bump both together.
claudial-icd = { version = "0.1.0", path = "../claudial-icd" }
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "d42d38a6887c1a4807a9351e177879ec30e9deb0", default-features = false, features = [
  "embassy-time",
  "disable-cache-padding",
  "defmt-v1",
] }
bbqueue = "0.7"
heapless = { version = "0.9", default-features = false }
mutex = "1.0.2"
axp2101-dd = { version = "0.3.0", features = ["defmt"] }
cst92xx = { version = "0.2.4", features = ["defmt"] }
pcf85063a = { version = "0.1.1", features = ["defmt"] }
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-hal-async = "1.0"
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt"] }
esp-radio = { version = "=1.0.0-beta.1", features = [
  "ble",
  "defmt",
  "esp-alloc",
  "esp32s3",
  "unstable",
] }
esp-storage = { version = "0.10.0", features = ["defmt", "embedded-storage", "esp32s3"] }
sequential-storage = "8.0.1"
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
# 0.8 moves to bt-hci 0.10; stay on 0.7 until esp-radio follows.
trouble-host = { version = "0.7.0", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
bytemuck         = "1.25.2"
embedded-hal     = "1.0"
time             = { version = "0.3.55", default-features = false }
# The CO5300 renderer uses the dirty-region alignment API currently available
# on Slint's upstream development branch. Cargo.lock pins the exact commit.
slint = { git = "https://github.com/slint-ui/slint.git", branch = "master", default-features = false, features = [
  "compat-1-2",
  "libm",
  "renderer-software",
  "unsafe-single-threaded",
] }
embassy-futures = "0.1.2"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint.git", branch = "master" }
