[workspace]
resolver = "2"
members = ["claudial-icd", "claudial-host"]
exclude = [
  "firmware", # Different toolchain (xtensa-esp32s3-none-elf, channel "esp")
]

# Curated strict lints; members opt in via `[lints] workspace = true`.
# The excluded firmware crate carries a verbatim copy of this table — keep the
# two in sync when editing.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
unused_async = "warn"

[workspace.dependencies]
claudial-icd = { path = "claudial-icd" }
# Pinned to a rev for reproducible builds, matching how oxifoc consumes ergot.
# Bump here and in firmware/Cargo.toml together, then refresh both lockfiles.
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "8d7db27e030564a048eb16c90080ae6730d14e11" }
postcard-schema = { version = "0.2.5", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
