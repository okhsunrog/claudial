[package]
name = "clawdmeter-host"
version = "0.1.0"
edition = "2024"
description = "Reads Claude Code usage and pushes it to a Clawdmeter over BLE"

[dependencies]
clawdmeter-icd = { workspace = true }
ergot = { workspace = true, features = ["tokio-std"] }
serde = { workspace = true, features = ["std"] }

anyhow = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# The upstream bluest lacks fixes this depends on; same fork oxifoc uses.
bluest = { git = "https://github.com/okhsunrog/bluest", rev = "9cb9dbcad63d7d2ffe18a20f87b7ffe1cb670537", features = ["unstable"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "http2", "charset"] }
# `direct` only: reading Claude Code's credential file.
serde_json = { version = "1.0.151", optional = true }
dirs = { version = "6.0.0", optional = true }
# `proxy` only: the proxy reports resets as RFC 3339 rather than epoch seconds.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"], optional = true }

[lints]
workspace = true

# Which usage backend to build. See `src/usage/mod.rs`; `proxy` wins if both
# end up enabled, so `--features proxy` works without disabling the default.
[features]
default = ["direct"]
direct = ["dep:serde_json", "dep:dirs"]
proxy = ["dep:chrono"]

[dev-dependencies]
serde_json = "1.0.151"
